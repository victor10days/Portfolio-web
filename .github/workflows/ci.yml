name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # build is `vite build && node server/seed.js`, so this also proves the
      # seed inserts cleanly against a fresh database, including the link
      # column and its migration.
      - run: npm run build
